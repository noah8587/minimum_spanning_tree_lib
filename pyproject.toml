[project]
name = "minimum-spanning-tree-lib"
version = "0.1.0"
description = "Builds a minimum spanning forest from a weighted undirected graph via Kruskal's algorithm."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
